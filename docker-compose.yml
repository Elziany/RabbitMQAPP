services:

  # =========================
  # Laravel App 1 - Publisher
  # =========================
  app1:
    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: laravel_app1
    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - ./app:/var/www

    networks:
      - laravel


  # =========================
  # Laravel App 2 - Consumer
  # =========================
  app2:
    build:
      context: ./receiver-app
      dockerfile: Dockerfile

    container_name: receiver-app
    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - ./receiver-app:/var/www

    networks:
      - laravel


  # =========================
  # Nginx
  # =========================
  nginx:
    image: nginx:alpine

    container_name: laravel_nginx
    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - ./app:/var/www/app
      - ./receiver-app:/var/www/receiver-app
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app1
      - app2

    networks:
      - laravel


  # =========================
  # MySQL
  # =========================
  mysql:
    image: mysql:8.0

    container_name: laravel_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - laravel


  # =========================
  # phpMyAdmin
  # =========================
  phpmyadmin:
    image: phpmyadmin:latest

    container_name: laravel_phpmyadmin
    restart: unless-stopped

    ports:
      - "8081:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: laravel
      PMA_PASSWORD: password

    depends_on:
      - mysql

    networks:
      - laravel


  # =========================
  # RabbitMQ
  # =========================
  rabbitmq:
    image: rabbitmq:4-management

    container_name: laravel_rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    ports:
      # RabbitMQ AMQP
      - "5672:5672"

      # RabbitMQ Management UI
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    networks:
      - laravel


# =========================
# Networks
# =========================
networks:
  laravel:


# =========================
# Volumes
# =========================
volumes:
  mysql_data:
  rabbitmq_data:
